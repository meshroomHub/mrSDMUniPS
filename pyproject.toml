[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-sdm-unips"
version = "2.0.0"
description = "Meshroom plugin for SDM-UniPS universal photometric stereo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil",
    "sdm-unips @ git+https://github.com/meshroomHubWarehouse/SDM-UniPS-CVPR2023.git@meshroom",
]

# Meshroom discovers the node from MESHROOM_PLUGINS_PATH, not site-packages.
# This distribution installs the plugin's dependencies into its venv.
[tool.setuptools]
packages = []
