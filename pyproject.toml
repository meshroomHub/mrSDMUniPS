[project]
name = "mrSDMUniPS"
version = "2.0.0"
description = "Meshroom plugin for SDM-UniPS universal photometric stereo."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}
authors = [{name = "Baptiste Brument"}]
dependencies = [
    "torch",
    "torchvision",
    "psutil",
    "sdm-unips",
]

# Meshroom discovers the node from MESHROOM_PLUGINS_PATH, not site-packages.
# uv only installs the plugin's dependencies into its venv.
[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
sdm-unips = { git = "https://github.com/meshroomHubWarehouse/SDM-UniPS-CVPR2023.git", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.meshroom]
publisher = "meshroomHub"
requirements = "Nvidia GPU with CUDA >= 12.X."

# If you prefer to work from a local SDM-UniPS
# env = [ { key = "SDM_UNIPS_PATH", type = "path", value = "/path/to/SDM-UniPS-CVPR2023" }, { key = "SDM_UNIPS_CHECKPOINT_PATH", type = "path", value = "/path/to/SDM-UniPS-CVPR2023/checkpoint" } ]

